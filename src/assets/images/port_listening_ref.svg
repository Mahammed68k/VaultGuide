<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%" style="font-family: system-ui, -apple-system, sans-serif;">
  <!-- Background with subtle border -->
  <rect x="0" y="0" width="1200" height="240" rx="16" fill="#fcf8f3" stroke="#dfcebd" stroke-width="1" />
  
  <!-- Header Title -->
  <text x="24" y="38" font-family="monospace" font-size="16" font-weight="bold" fill="#c2410c">&gt;_</text>
  <text x="50" y="38" font-size="16" font-weight="bold" fill="#2d1c10">Port Listening Verification Commands</text>
  
  <!-- Subtitle -->
  <text x="24" y="60" font-size="12" fill="#7d5b3f">Run these verification commands in Command Prompt or PowerShell to confirm that your background services are actively accepting connections:</text>
  
  <!-- Card 1: FileZilla SFTP -->
  <g>
    <rect x="24" y="78" width="370" height="142" rx="14" fill="#ffffff" stroke="#dfcebd" stroke-width="1" />
    <text x="42" y="104" font-size="13" font-weight="bold" fill="#2d1c10">FileZilla SFTP (Port 22)</text>
    
    <!-- Badge -->
    <rect x="336" y="90" width="44" height="20" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="1" />
    <text x="358" y="104" font-size="10" font-weight="bold" fill="#b45309" text-anchor="middle">TCP</text>
    
    <!-- Code Command -->
    <text x="42" y="136" font-family="monospace" font-size="12" fill="#92400e">netstat -an | findstr 22</text>
    
    <!-- Copy Button -->
    <rect x="42" y="156" width="334" height="42" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1" />
    <!-- Copy icon -->
    <path d="M174 172 h10 a2 2 0 0 1 2 2 v10 a2 2 0 0 1 -2 2 h-10 a2 2 0 0 1 -2 -2 v-10 a2 2 0 0 1 2 -2 z" fill="none" stroke="#b45309" stroke-width="1.5" />
    <path d="M171 176 h-2 a2 2 0 0 0 -2 2 v10 a2 2 0 0 0 2 2 h10 a2 2 0 0 0 2 -2 v-2" fill="none" stroke="#b45309" stroke-width="1.5" />
    <text x="214" y="182" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">Copy netstat</text>
  </g>
  
  <!-- Card 2: Nextcloud Master -->
  <g>
    <rect x="415" y="78" width="370" height="142" rx="14" fill="#ffffff" stroke="#dfcebd" stroke-width="1" />
    <text x="433" y="104" font-size="13" font-weight="bold" fill="#2d1c10">Nextcloud Master (8080)</text>
    
    <!-- Badge -->
    <rect x="696" y="90" width="75" height="20" rx="10" fill="#cffafe" stroke="#a5f3fc" stroke-width="1" />
    <text x="733" y="104" font-size="10" font-weight="bold" fill="#0e7490" text-anchor="middle">CONTAINER</text>
    
    <!-- Code Command -->
    <text x="433" y="136" font-family="monospace" font-size="12" fill="#0e7490">docker ps --filter "name=nextcloud"</text>
    
    <!-- Copy Button -->
    <rect x="433" y="156" width="334" height="42" rx="10" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1" />
    <!-- Copy icon -->
    <path d="M560 172 h10 a2 2 0 0 1 2 2 v10 a2 2 0 0 1 -2 2 h-10 a2 2 0 0 1 -2 -2 v-10 a2 2 0 0 1 2 -2 z" fill="none" stroke="#0e7490" stroke-width="1.5" />
    <path d="M557 176 h-2 a2 2 0 0 0 -2 2 v10 a2 2 0 0 0 2 2 h10 a2 2 0 0 0 2 -2 v-2" fill="none" stroke="#0e7490" stroke-width="1.5" />
    <text x="604" y="182" font-size="12" font-weight="600" fill="#0e7490" text-anchor="middle">Copy docker ps</text>
  </g>
  
  <!-- Card 3: Tailscale Serve -->
  <g>
    <rect x="806" y="78" width="370" height="142" rx="14" fill="#ffffff" stroke="#dfcebd" stroke-width="1" />
    <text x="824" y="104" font-size="13" font-weight="bold" fill="#2d1c10">Tailscale Serve (Port 443)</text>
    
    <!-- Badge -->
    <rect x="715" y="90" width="55" height="20" rx="10" fill="#d1fae5" stroke="#a7f3d0" stroke-width="1" transform="translate(390, 0)" />
    <text x="1132" y="104" font-size="10" font-weight="bold" fill="#047857" text-anchor="middle">PROXY</text>
    
    <!-- Code Command -->
    <text x="824" y="136" font-family="monospace" font-size="12" fill="#047857">tailscale serve status</text>
    
    <!-- Copy Button -->
    <rect x="824" y="156" width="334" height="42" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <!-- Copy icon -->
    <path d="M950 172 h10 a2 2 0 0 1 2 2 v10 a2 2 0 0 1 -2 2 h-10 a2 2 0 0 1 -2 -2 v-10 a2 2 0 0 1 2 -2 z" fill="none" stroke="#047857" stroke-width="1.5" />
    <path d="M947 176 h-2 a2 2 0 0 0 -2 2 v10 a2 2 0 0 0 2 2 h10 a2 2 0 0 0 2 -2 v-2" fill="none" stroke="#047857" stroke-width="1.5" />
    <text x="996" y="182" font-size="12" font-weight="600" fill="#047857" text-anchor="middle">Copy serve status</text>
  </g>
</svg>
